<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWidget Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ChatWidget Direct Test</h1>
        <p>This page tests the ChatWidget component directly with proper API connection to the backend server.</p>
        <p>The chat widget should appear as a floating widget in the bottom right corner.</p>
    </div>

    <div class="chat-container" id="chat-root">
        <!-- The chat widget will be mounted here -->
    </div>

    <!-- Load React and ReactDOM from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Load the ChatWidget component -->
    <script type="text/babel">
        // We'll simulate loading the ChatWidget component here
        // Since we can't directly load the JSX file in browser, we'll create a basic version
        const { useState, useEffect, useRef } = React;

        // Simple version of the ChatWidget to test functionality
        function ChatWidget() {
            const [messages, setMessages] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const messagesEndRef = useRef(null);

            // Scroll to bottom of messages
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!inputValue.trim() || isLoading) return;

                // Add user message
                const userMessage = { type: 'user', content: inputValue, timestamp: new Date() };
                setMessages(prev => [...prev, userMessage]);
                setIsLoading(true);

                try {
                    // Test the API endpoint with the correct port
                    const response = await fetch(`http://localhost:8000/chat?query=${encodeURIComponent(inputValue)}&session_id=test123`, {
                        method: 'POST'
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();

                    // Add assistant message
                    const assistantMessage = {
                        type: 'assistant',
                        content: data.answer,
                        timestamp: new Date()
                    };
                    setMessages(prev => [...prev, assistantMessage]);

                } catch (error) {
                    console.error('Error:', error);
                    const errorMessage = {
                        type: 'assistant',
                        content: `Sorry, I encountered an error: ${error.message}`,
                        timestamp: new Date()
                    };
                    setMessages(prev => [...prev, errorMessage]);
                } finally {
                    setIsLoading(false);
                }

                setInputValue('');
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSubmit(e);
                }
            };

            return (
                <div style={{
                    width: '400px',
                    height: '500px',
                    border: '1px solid #ddd',
                    borderRadius: '8px',
                    overflow: 'hidden',
                    backgroundColor: 'white',
                    boxShadow: '0 4px 12px rgba(0,0,0,0.15)',
                    display: 'flex',
                    flexDirection: 'column'
                }}>
                    <div style={{
                        padding: '16px',
                        backgroundColor: '#f8f9fa',
                        borderBottom: '1px solid #ddd',
                        fontWeight: 'bold'
                    }}>
                        Documentation Assistant
                    </div>

                    <div style={{
                        flex: 1,
                        overflowY: 'auto',
                        padding: '16px',
                        display: 'flex',
                        flexDirection: 'column',
                        gap: '12px'
                    }}>
                        {messages.length === 0 ? (
                            <div style={{
                                textAlign: 'center',
                                color: '#666',
                                fontStyle: 'italic',
                                margin: 'auto'
                            }}>
                                Ask me anything about the documentation!
                            </div>
                        ) : (
                            messages.map((message, index) => (
                                <div
                                    key={index}
                                    style={{
                                        alignSelf: message.type === 'user' ? 'flex-end' : 'flex-start',
                                        backgroundColor: message.type === 'user' ? '#e3f2fd' : '#f5f5f5',
                                        padding: '12px',
                                        borderRadius: '18px',
                                        maxWidth: '80%'
                                    }}
                                >
                                    <div>{message.content}</div>
                                    <div style={{
                                        fontSize: '0.7em',
                                        color: '#999',
                                        textAlign: 'right',
                                        marginTop: '4px'
                                    }}>
                                        {message.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                    </div>
                                </div>
                            ))
                        )}
                        {isLoading && (
                            <div style={{
                                alignSelf: 'flex-start',
                                backgroundColor: '#f5f5f5',
                                padding: '12px',
                                borderRadius: '18px'
                            }}>
                                <div>Thinking...</div>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    <form onSubmit={handleSubmit} style={{
                        display: 'flex',
                        padding: '16px',
                        borderTop: '1px solid #ddd',
                        backgroundColor: 'white'
                    }}>
                        <input
                            value={inputValue}
                            onChange={(e) => setInputValue(e.target.value)}
                            onKeyDown={handleKeyDown}
                            placeholder="Ask a question..."
                            disabled={isLoading}
                            style={{
                                flex: 1,
                                padding: '10px',
                                border: '1px solid #ddd',
                                borderRadius: '18px',
                                marginRight: '8px'
                            }}
                        />
                        <button
                            type="submit"
                            disabled={isLoading || !inputValue.trim()}
                            style={{
                                padding: '10px 16px',
                                backgroundColor: '#1976d2',
                                color: 'white',
                                border: 'none',
                                borderRadius: '18px',
                                cursor: isLoading || !inputValue.trim() ? 'not-allowed' : 'pointer'
                            }}
                        >
                            {isLoading ? '...' : 'Send'}
                        </button>
                    </form>
                </div>
            );
        }

        // Render the chat widget
        const rootElement = document.getElementById('chat-root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<ChatWidget />);
    </script>
</body>
</html>
